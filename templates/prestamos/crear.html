{% extends "base.html" %}

{% block title %}Crear Préstamo - Sistema de Inventario{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h4><i class="bi bi-plus-circle"></i> Registrar Nuevo Préstamo</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('crear_prestamo') }}">
                        <div class="mb-3">
                            <label for="id_equipo" class="form-label">Equipo</label>
                            <select class="form-select" id="id_equipo" name="id_equipo" required>
                                <option value="">Seleccione un equipo</option>
                                {% for equipo in equipos %}
                                <option value="{{ equipo.id }}">{{ equipo.nombre }} - {{ equipo.estado }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="id_usuario" class="form-label">Usuario</label>
                            <select class="form-select" id="id_usuario" name="id_usuario" required>
                                <option value="">Seleccione un usuario</option>
                                {% for usuario in usuarios %}
                                <option value="{{ usuario.id }}">{{ usuario.nombre }} - {{ usuario.cargo }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="fecha_prestamo" class="form-label">Fecha de Préstamo</label>
                            <input type="date" class="form-control" id="fecha_prestamo" name="fecha_prestamo" required>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('prestamos') }}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Establecer fecha actual por defecto
    document.getElementById('fecha_prestamo').valueAsDate = new Date();
</script>
{% endblock %}
